# Docker Compose для KeyMarket
# Запускает PostgreSQL, бэкенд (Fastify + Prisma) и фронтенд (React + Nginx)
services:
  # База данных PostgreSQL
  postgres:
    image: postgres:18-alpine
    container_name: keymarket-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keymarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keymarket
    ports:
      - "5433:5432"   # внешний порт 5433, чтобы не конфликтовать с локальным PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keymarket -d keymarket"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Бэкенд (Fastify + Prisma)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keymarket-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      # Новые переменные окружения для гибкой настройки хостов
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # SMTP можно передать при необходимости, иначе используется Ethereal
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASS: ${SMTP_PASS}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Фронтенд (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keymarket-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

# Volumes
volumes:
  pgdata: