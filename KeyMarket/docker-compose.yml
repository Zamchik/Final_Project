services:
  postgres:
    image: postgres:15-alpine
    container_name: keymarket-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keymarket
      POSTGRES_PASSWORD: keymarket123
      POSTGRES_DB: keymarket
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: