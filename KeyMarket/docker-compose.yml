version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: keymarket-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keymarket
      POSTGRES_PASSWORD: keymarket123
      POSTGRES_DB: keymarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: