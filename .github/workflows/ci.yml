# Автоматический запуск тестов при push и pull request.
# Содержит две задачи: backend-test и frontend-test.

name: CI

# Запускать при пуше в любую ветку и при создании pull request
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # Тесты бэкенда
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    # Сервис PostgreSQL для тестов бэкенда
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keymarket
          POSTGRES_PASSWORD: keymarket123
          POSTGRES_DB: keymarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keymarket -d keymarket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Получаем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Node.js (используем LTS 22)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Устанавливаем зависимости бэкенда
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Генерируем Prisma Client (надо для тестов)
      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      # Применяем миграции к тестовой бд
      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://keymarket:keymarket123@localhost:5432/keymarket
        run: npx prisma migrate deploy

      # Запускаем тесты бэкенда
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://keymarket:keymarket123@localhost:5432/keymarket
          SESSION_SECRET: test-secret-key
        run: npm test

  # Тесты фронтенда
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test